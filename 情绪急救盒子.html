<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流浪者的情绪急救盒子</title>
    <link rel="icon" href="https://i.imgs.ovh/2025/09/21/7VpUGt.jpeg" type="image/jpeg">
    <style>
        /* 全局样式 */
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
            background-color: #f0f0f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.6;
            background-image: linear-gradient(135deg, #e0e0f0 0%, #f5f5ff 100%);
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #d0c0e0;
        }

        h1, h2 {
            color: #7b4397;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(123, 67, 151, 0.2);
        }

        /* --- 按钮通用样式 --- */
        button {
            background-color: #9370DB;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin: 5px;
        }

        button:hover {
            background-color: #B19CDD;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* --- 用户设置区 --- */
        .user-settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px dashed #d0c0e0;
            padding-bottom: 20px;
        }

        .user-avatar-upload {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #9370DB;
            cursor: pointer;
            background-color: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .user-avatar-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-avatar-upload span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 0.75em;
            padding: 3px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .user-avatar-upload:hover span {
            opacity: 1;
        }


        .user-name-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name-input label {
            font-size: 1.1em;
            color: #555;
        }

        .user-name-input input[type="text"] {
            background-color: #f9f9ff;
            border: 1px solid #d0c0e0;
            border-radius: 5px;
            padding: 8px 12px;
            color: #333;
            font-size: 1em;
            width: 150px;
            box-sizing: border-box;
        }

        /* --- 安慰话语区 --- */
        .comfort-zone {
            background-color: #f0e6fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #d0c0e0;
        }

        #comfortMessage {
            font-style: italic;
            color: #666;
            margin-bottom: 15px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 音乐播放器样式 */
        .music-player {
            margin-top: 15px;
        }
        
        .music-player audio {
            width: 100%;
            max-width: 300px;
        }

        /* --- 翻牌区 --- */
        .flip-card-zone {
            margin-bottom: 30px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .flip-card {
            background-color: transparent;
            width: 150px;
            height: 100px;
            perspective: 1000px;
            margin: auto;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
            color: white;
            padding: 5px;
            box-sizing: border-box;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #9370DB, #B19CDD);
            border: 2px solid #7b4397;
        }

        .flip-card-back {
            background-color: #B19CDD;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #7b4397;
            padding: 10px;
            font-size: 0.9em;
            text-align: center;
        }

        /* --- 聊天区 --- */
        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .chat-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .chat-box {
            background-color: #ffffff;
            width: 90%;
            max-width: 600px;
            height: 80%;
            max-height: 700px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid #d0c0e0;
        }

        .chat-header {
            background-color: #f0e6fa;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #d0c0e0;
            position: relative;
        }

        .chat-header .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #9370DB;
        }

        .chat-header .chat-partner-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #7b4397;
        }

        .chat-header .close-chat {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            border: none;
            color: #666;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .chat-header .close-chat:hover {
            color: #ff6b6b;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #f9f9ff;
        }

        /* 滚动条美化 */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #e0e0f0;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #B19CDD;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #9370DB;
        }

        /* 聊天消息布局修改 */
        .chat-message {
            display: flex;
            align-items: flex-start;
            gap: 10px; /* 统一设置头像和气泡之间的间距 */
        }

        .chat-message.system {
            justify-content: center; /* 系统消息居中 */
        }
        
        /* 流浪者头像和气泡在左边 */
        .chat-message.partner {
            flex-direction: row; 
        }
        
        /* 自己的头像和气泡在右边 */
        .chat-message.self {
            flex-direction: row-reverse; 
        }

        .chat-message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #B19CDD;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .chat-message.self .message-bubble {
            background-color: #9370DB;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .chat-message.partner .message-bubble {
            background-color: #e0e6fa;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .chat-message.system .message-bubble {
            background-color: #ddd;
            color: #555;
            text-align: center;
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 10px;
            margin: 5px auto;
        }

        .chat-options {
            padding: 15px 20px;
            border-top: 1px solid #d0c0e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background-color: #f0e6fa;
        }

        .chat-options button {
            background-color: #B19CDD;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 0.95em;
            transition: background-color 0.3s ease;
            color: white;
        }

        .chat-options button:hover {
            background-color: #9370DB;
            transform: none;
        }

        /* 陪伴模式样式 */
        .companion-mode-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-image: url('https://i.imgs.ovh/2025/09/21/7Vuxc0.jpeg');
            background-size: cover;
            background-position: center;
            position: relative;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            color: white;
        }

        .companion-mode-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .companion-timer {
            font-size: 1.2em;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .companion-bubble {
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
            padding: 15px;
            border-radius: 20px;
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, transform 0.5s ease;
            font-style: italic;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .companion-bubble.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-20px);
        }

        .companion-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .companion-controls audio {
            width: 100%;
            max-width: 250px;
            margin-top: 10px;
        }

        .companion-controls button {
            background-color: #B19CDD;
        }
        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            h1 {
                font-size: 1.8em;
            }
            h2 {
                font-size: 1.4em;
            }
            .user-settings {
                flex-direction: column;
            }
            .user-name-input {
                flex-direction: column;
                align-items: center;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
            .flip-card {
                width: 120px;
                height: 80px;
            }
            .chat-box {
                height: 90%;
                max-width: 95%;
            }
            .chat-header .chat-partner-name {
                font-size: 1.1em;
            }
            .chat-header .chat-avatar {
                width: 40px;
                height: 40px;
            }
            .chat-options button {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>流浪者的情绪急救盒子</h1>

        <div class="user-settings">
            <div class="user-avatar-upload">
                <label for="userAvatarInput" class="upload-btn">
                    <img id="userAvatarDisplay" src="https://via.placeholder.com/60?text=你的头像" alt="你的头像">
                    <span>点击上传头像</span>
                </label>
                <input type="file" id="userAvatarInput" accept="image/*" style="display: none;">
            </div>
            <div class="user-name-input">
                <label for="userName">你的名字：</label>
                <input type="text" id="userName" placeholder="请输入你的名字">
                <button id="saveUserSettings">保存设置</button>
            </div>
        </div>

        <div class="comfort-zone">
            <h2>猫猫有话说</h2>
            <p id="comfortMessage">点击“听听看”获取新的安慰话语。</p>
            <button id="shuffleComfort">听听看</button>
            <div class="music-player">
                <audio controls loop autoplay>
                    <source src="https://image.uglycat.cc/464zhp.mp3" type="audio/mp3">
                    你的浏览器不支持音频播放。
                </audio>
            </div>
        </div>

        <div class="flip-card-zone">
            <h2>选择一个情绪主题</h2>
            <div class="card-grid" id="cardGrid">
                </div>
        </div>

        <div class="chat-overlay" id="chatOverlay">
            <div class="chat-box" id="chatBox">
                <div class="chat-header">
                    <img src="https://i.imgs.ovh/2025/09/21/7VpUGt.jpeg" alt="流浪者头像" class="chat-avatar">
                    <span class="chat-partner-name">流浪者</span>
                    <button class="close-chat" id="closeChat">X</button>
                </div>
                <div class="chat-messages" id="chatMessages">
                    </div>
                <div class="chat-options" id="chatOptions">
                    </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素获取 ---
            const userAvatarInput = document.getElementById('userAvatarInput');
            const userAvatarDisplay = document.getElementById('userAvatarDisplay');
            const userNameInput = document.getElementById('userName');
            const saveUserSettingsBtn = document.getElementById('saveUserSettings');
            const comfortMessageDisplay = document.getElementById('comfortMessage');
            const shuffleComfortBtn = document.getElementById('shuffleComfort');
            const cardGrid = document.getElementById('cardGrid');
            const chatOverlay = document.getElementById('chatOverlay');
            const chatBox = document.getElementById('chatBox');
            
            // 声明这些变量，以便在退出陪伴模式时重新引用
            let closeChatBtn = document.getElementById('closeChat');
            let chatMessagesContainer = document.getElementById('chatMessages');
            let chatOptionsContainer = document.getElementById('chatOptions');

            const partnerAvatar = 'https://i.imgs.ovh/2025/09/21/7VpUGt.jpeg'; // 流浪者固定头像
            const companionBgImage = 'https://i.imgs.ovh/2025/09/21/7Vuxc0.jpeg'; // 陪伴模式背景图

            // 从 localStorage 加载用户设置
            let currentUserAvatar = localStorage.getItem('userAvatar') || 'https://via.placeholder.com/60?text=你的头像';
            let currentUserName = localStorage.getItem('userName') || '旅行者';
            let userRealName = localStorage.getItem('userRealName') || '旅行者';

            userAvatarDisplay.src = currentUserAvatar;
            userNameInput.value = currentUserName;
            
            // 在页面加载时更新所有用户的头像
            function updateAllUserAvatars() {
                document.querySelectorAll('.chat-message.self .avatar').forEach(img => img.src = currentUserAvatar);
            }

            // --- 用户设置功能 ---
            userAvatarInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        currentUserAvatar = e.target.result;
                        userAvatarDisplay.src = currentUserAvatar;
                        localStorage.setItem('userAvatar', currentUserAvatar);
                        updateAllUserAvatars(); // 更新聊天框中所有自己的头像
                        alert('头像已保存！');
                    };
                    reader.readAsDataURL(file);
                }
            });

            saveUserSettingsBtn.addEventListener('click', () => {
                currentUserName = userNameInput.value.trim();
                if (currentUserName === '') {
                    currentUserName = '旅行者'; // 默认名称
                }
                localStorage.setItem('userName', currentUserName);
                alert('名字已保存！');
            });

            // --- 安慰话语库 ---
            const comfortMessages = [
                "愚蠢的人类，连自己的情绪都管理不好吗？（开玩笑的，我在这里）",
                "哈？要我的建议？闭上眼好好睡个觉，没人会讨厌你的。",
                "虽然我不喜欢麻烦，但为了你，或者说，是有关你的事都不算麻烦。",
                "哼，看你这副样子，真让人不省心，快点好起来。",
                "别指望我会说些好听的，但如果你需要，我就在这里。",
                "你的情绪是你的事，我相信你有处理好的能力，但如果你想倾诉，我可以勉强听听。"
            ];

            function getRandomComfortMessage() {
                const randomIndex = Math.floor(Math.random() * comfortMessages.length);
                comfortMessageDisplay.textContent = comfortMessages[randomIndex];
            }

            shuffleComfortBtn.addEventListener('click', getRandomComfortMessage);
            getRandomComfortMessage();

            // --- 情绪聊天主题及对话内容 ---
            const chatThemes = [
                {
                    id: 'theme1',
                    title: '感到压力与焦虑',
                    dialogue: {
                        start: {
                            message: "看你愁眉不展的，又是那些无聊的压力和焦虑在作祟吗？真是群麻烦的家伙。",
                            sender: 'partner',
                            options: [
                                { text: "嗯，最近压力确实有点大...", nextMsgId: "theme1_msg1" },
                                { text: "才不是！我只是在思考人生！", nextMsgId: "theme1_msg2" }
                            ]
                        },
                        theme1_msg1: {
                            message: "哼，还算有自知之明。那些庸人俗事总会让人困扰。但如果是想向前走，仅仅是抱怨可不能解决问题。",
                            sender: 'partner',
                            options: [
                                { text: "那...我该怎么办呢？", nextMsgId: "theme1_msg3" },
                                { text: "我只是想找个人说说...", nextMsgId: "theme1_msg4" }
                            ]
                        },
                        theme1_msg2: {
                            message: "思考人生？嗯，或许吧，宁可痛苦也勿麻木。面对它，解决它，这才是你应该做的。",
                            sender: 'partner',
                            options: [
                                { text: "好吧，我承认有点焦虑...", nextMsgId: "theme1_msg3" },
                                { text: "才没有逃避！", nextMsgId: "theme1_msg5" }
                            ]
                        },
                        theme1_msg3: {
                            message: "首先，别把所有事情都压在自己身上。有些责任，你可以选择放下。深呼吸，感受你自己的心跳。",
                            sender: 'partner',
                            options: [
                                { text: "但我担心做不好...", nextMsgId: "theme1_msg6" },
                                { text: "深呼吸...感觉好了一点。", nextMsgId: "theme1_msg7" }
                            ]
                        },
                        theme1_msg4: {
                            message: "说完了？。",
                            sender: 'partner',
                            options: [
                                { text: "（沉默）", nextMsgId: "theme1_msg7" }
                            ]
                        },
                        theme1_msg5: {
                            message: "嘴硬的家伙…哈，我也不用非得撬出话来，反正你此时想到的是我，不是吗？",
                            sender: 'partner',
                            options: [
                                { text: "害怕失败...", nextMsgId: "theme1_msg6" },
                                { text: "害怕不被认可...", nextMsgId: "theme1_msg6" }
                            ]
                        },
                        theme1_msg6: {
                            message: "失败是必然的，没有人能永远成功。重要的不是结果，而是你从中学到了什么。至于认可...你真的需要别人的认可吗？你就是你。",
                            sender: 'partner',
                            options: [
                                { text: "我明白了...", nextMsgId: "theme1_end" },
                                { text: "可是...", nextMsgId: "theme1_msg7" }
                            ]
                        },
                        theme1_msg7: {
                            message: "还是想不通？如果无法改变，就接受它。如果你能改变，那就去行动。拖延的坏处需要我再提醒你？",
                            sender: 'partner',
                            options: [
                                { text: "谢谢你…", nextMsgId: "theme1_end" }
                            ]
                        },
                        theme1_end: {
                            message: "哼，希望你真的明白了。去吧，让自己轻快些。",
                            sender: 'partner',
                            options: [{ text: "好。", nextMsgId: "chat_end" }]
                        }
                    }
                },
                {
                    id: 'theme2',
                    title: '感到孤独与失落',
                    dialogue: {
                        start: {
                            message: "怎么，一个人呆着，又在感叹这世界的无聊吗？这种情绪，真是庸俗。",
                            sender: 'partner',
                            options: [
                                { text: "我只是觉得有点孤单...", nextMsgId: "theme2_msg1" },
                                { text: "才不是，我只是享受独处！", nextMsgId: "theme2_msg2" }
                            ]
                        },
                        theme2_msg1: {
                            message: "孤单？那又如何？这世间万物本就各自为营。人与人不过生命中的一段过客，不会有人永远相伴的。",
                            sender: 'partner',

                avatarImg.src = sender === 'self' ? currentUserAvatar : partnerAvatar;

                }

                currentMessageId = messageId;

                chatOptionsContainer.innerHTML = '';

                // 特殊处理姓名录入
                if (messageId === 'name_prompt') {
                    setTimeout(() => {
                        appendMessage(dialogue.message, dialogue.sender);
                        const nameInput = prompt('我想知道，怎么称呼屏幕后的那个“你"？：');
                        if (nameInput) {
                            userRealName = nameInput.trim();
                            localStorage.setItem('userRealName', userRealName);
                            appendMessage(userRealName, 'self');
                            setTimeout(() => displayDialogue('get_name'), 500);
                        } else {
                            userRealName = '旅行者';
                            localStorage.setItem('userRealName', userRealName);
                            appendMessage('（未输入名字）', 'self');
                            setTimeout(() => displayDialogue('get_name'), 500);
                        }
                    }, 500);
                    return;
                }

                appendMessage(dialogue.message, dialogue.sender);

                if (dialogue.options && dialogue.options.length > 0) {
                    dialogue.options.forEach(option => {
                        const optionBtn = document.createElement('button');
                        optionBtn.textContent = option.text;
                        optionBtn.addEventListener('click', () => {
                            appendMessage(option.text, 'self');

                            if (option.nextMsgId === "chat_end") {
                                setTimeout(() => {
                                    appendMessage("哼，不愧是你。好好休息吧。", 'partner');
                                    chatOptionsContainer.innerHTML = '';
                                }, 500);
                            } else {
                                setTimeout(() => displayDialogue(option.nextMsgId), 500);
                            }
                        });
                        chatOptionsContainer.appendChild(optionBtn);
                    });
                }
            }
            
            // 修复 bug #1：新增函数用于重置所有卡片状态
            function resetAllCards() {
                document.querySelectorAll('.flip-card').forEach(card => {
                    card.classList.remove('flipped');
                });
            }

            // 修复 bug #2：将聊天框关闭逻辑封装为函数，以便复用和重新绑定
            function closeChatAndReset() {
                chatOverlay.classList.remove('active');
                chatMessagesContainer.innerHTML = '';
                chatOptionsContainer.innerHTML = '';
                // 在关闭时重置所有卡片，确保卡片翻回
                resetAllCards(); 
            }

            function openChat(theme) {
                if (theme.id === 'theme_companion') {
                    openCompanionMode();
                } else {
                    currentThemeDialogue = theme.dialogue;
                    chatOverlay.classList.add('active');
                    chatBox.classList.remove('companion-mode');
                    chatMessagesContainer.innerHTML = '';
                    chatOptionsContainer.innerHTML = ''; // 确保选项区域也被清空
                    displayDialogue('start');
                    // 修复 bug #2：重新绑定普通模式下的关闭按钮事件
                    closeChatBtn = document.getElementById('closeChat');
                    closeChatBtn.removeEventListener('click', closeChatAndReset); // 移除旧的监听器以防重复
                    closeChatBtn.addEventListener('click', closeChatAndReset);
                }
            }
            
            function openCompanionMode() {
                chatOverlay.classList.add('active');
                chatBox.classList.add('companion-mode');

                chatBox.innerHTML = `
                    <div class="chat-header">
                        <img src="${partnerAvatar}" alt="流浪者头像" class="chat-avatar">
                        <span class="chat-partner-name">流浪者</span>
                        <button class="close-chat" id="closeChatCompanion">X</button>
                    </div>
                    <div class="companion-mode-content" style="background-image: url('${companionBgImage}');">
                        <div class="companion-mode-header">
                            <span>流浪者的陪伴</span>
                            <span id="companionTimer" class="companion-timer">00:00:00</span>
                        </div>
                        <img src="${partnerAvatar}" alt="流浪者侧写" style="width: 150px; height: auto; margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                        <div id="companionBubble" class="companion-bubble"></div>
                        <div class="companion-controls">
                            <button id="triggerBubbleBtn">戳一戳流浪者</button>
                            <audio id="companionMusic" controls loop autoplay>
                                <source src="https://music.163.com/song/media/outer/url?id=2604919859.mp3" type="audio/mp3">
                            </audio>
                        </div>
                    </div>
                `;

                const closeChatCompanionBtn = document.getElementById('closeChatCompanion');
                const companionTimerDisplay = document.getElementById('companionTimer');
                const triggerBubbleBtn = document.getElementById('triggerBubbleBtn');
                const companionBubble = document.getElementById('companionBubble');
                const companionMusic = document.getElementById('companionMusic');
                
                companionMusic.volume = 0.5; // 设置音乐音量

                let seconds = 0;
                companionTimerInterval = setInterval(() => {
                    seconds++;
                    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const s = (seconds % 60).toString().padStart(2, '0');
                    companionTimerDisplay.textContent = `${h}:${m}:${s}`;
                }, 1000);

                let lastBubbleTime = 0;
                function showRandomBubble() {
                    companionBubble.textContent = getRandomCompanionBubble();
                    companionBubble.classList.add('active');
                    setTimeout(() => {
                        companionBubble.classList.remove('active');
                    }, 5000);
                }

                showRandomBubble(); // 初次显示
                companionRandomInteractionInterval = setInterval(() => {
                    showRandomBubble();
                }, 15000); // 每15秒随机触发一次

                triggerBubbleBtn.addEventListener('click', () => {
                    showRandomBubble();
                });

                // 修复 bug #2：将陪伴模式的关闭逻辑也封装为函数
                function closeCompanionAndReset() {
                    clearInterval(companionTimerInterval);
                    clearInterval(companionRandomInteractionInterval);
                    chatOverlay.classList.remove('active');
                    chatBox.classList.remove('companion-mode');
                    // 重置 chatBox 的内容为普通聊天模式
                    chatBox.innerHTML = `
                        <div class="chat-header">
                            <img src="${partnerAvatar}" alt="流浪者头像" class="chat-avatar">
                            <span class="chat-partner-name">流浪者</span>
                            <button class="close-chat" id="closeChat">X</button>
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-options" id="chatOptions"></div>
                    `;
                    // 重新获取并绑定新的关闭按钮事件
                    closeChatBtn = document.getElementById('closeChat');
                    closeChatBtn.addEventListener('click', closeChatAndReset);
                    
                    // --- 修复新bug的关键代码：重新获取 chatMessagesContainer 和 chatOptionsContainer ---
                    chatMessagesContainer = document.getElementById('chatMessages');
                    chatOptionsContainer = document.getElementById('chatOptions');
                    
                    // 在关闭时重置所有卡片
                    resetAllCards();
                }

                closeChatCompanionBtn.addEventListener('click', closeCompanionAndReset);
            }

            // 初始绑定关闭事件
            closeChatBtn.addEventListener('click', closeChatAndReset);

            // --- 翻牌区功能 ---
            function createCard(theme) {
                const cardWrapper = document.createElement('div');
                cardWrapper.classList.add('flip-card');
                cardWrapper.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <span>${theme.title}</span>
                        </div>
                        <div class="flip-card-back">
                            <span>点击开始对话</span>
                        </div>
                    </div>
                `;
                cardWrapper.addEventListener('click', () => {
                    cardWrapper.classList.add('flipped');
                    setTimeout(() => {
                        openChat(theme);
                        // 移除这里的翻回逻辑，改为在关闭聊天框时统一处理
                    }, 600);
                });
                cardGrid.appendChild(cardWrapper);
            }

            // Shuffle and display cards on page load
            function shuffleAndDisplayCards() {
                const shuffledThemes = [...chatThemes].sort(() => Math.random() - 0.5);
                cardGrid.innerHTML = ''; // Clear existing cards
                shuffledThemes.forEach(createCard);
            }

            shuffleAndDisplayCards();
        });
    </script>
</body>
</html>
